<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MealMiles is preparing a new online shopping experience.">
  <meta name="robots" content="noindex, nofollow">
  <title>MealMiles — A new experience is coming</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0b0b0d;
      --surface: #151519;
      --text: #f5f3ef;
      --muted: #a5a1a8;
      --accent: #d5b77a;
      --line: rgba(255, 255, 255, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 20%, rgba(213, 183, 122, 0.12), transparent 34rem),
        radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.06), transparent 30rem),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 1.25rem;
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      content: "";
      pointer-events: none;
    }

    main {
      width: min(44rem, calc(100% - 4rem));
      padding: 4rem 0;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 2rem;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 12ch;
      margin: 0 auto;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 9vw, 6.5rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.94;
    }

    p {
      max-width: 33rem;
      margin: 2rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.7;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: 3.5rem;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .mark::before {
      width: 1.8rem;
      height: 1px;
      background: var(--accent);
      content: "";
    }

    @media (max-width: 36rem) {
      body::before {
        inset: 0.75rem;
        border-radius: 1rem;
      }

      main {
        width: min(100% - 3rem, 34rem);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Something new is taking shape</div>
    <h1>A new experience is coming.</h1>
    <p>
      We’re preparing a thoughtfully curated online shopping experience.
      Please check back soon.
    </p>
    <div class="mark">MealMiles</div>
  </main>
</body>
</html>
